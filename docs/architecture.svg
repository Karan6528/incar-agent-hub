<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" role="img" xmlns:c2pa="http://c2pa.org/manifest">
  <title>In-Car AI Agent Hub architecture</title>
  <desc>Driver UI calls the host agent, which uses an LLM via Groq, calls the MCP server for car tools and delegates charging planning to an A2A agent. Both use the mock vehicle backend. Everything runs in one FastAPI Docker container behind an API key.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .th { font-size: 14px; font-weight: 600; }
      .ts { font-size: 12px; }
      .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="680" height="530" fill="#FFFFFF"/>

  <rect x="30" y="120" width="450" height="370" rx="16" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
  <text class="ts" x="50" y="474" fill="#5F5E5A" dominant-baseline="central">FastAPI app · one Docker container · API key on /mcp, /a2a, /api</text>

  <rect x="165" y="30" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text class="th" x="255" y="49" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Driver / web UI</text>
  <text class="ts" x="255" y="67" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Chat via /api/chat</text>
  <line x1="255" y1="86" x2="255" y2="176" class="arr" marker-end="url(#arrow)"/>

  <rect x="155" y="180" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text class="th" x="255" y="199" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Host agent</text>
  <text class="ts" x="255" y="217" fill="#534AB7" text-anchor="middle" dominant-baseline="central">LLM tool-calling loop</text>

  <rect x="505" y="180" width="145" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text class="th" x="577" y="199" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">LLM (Groq)</text>
  <text class="ts" x="577" y="217" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">gpt-oss-120b</text>
  <line x1="359" y1="208" x2="501" y2="208" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <path d="M210 236 L210 262 L150 262 L150 286" class="arr" marker-end="url(#arrow)"/>
  <path d="M300 236 L300 262 L365 262 L365 286" class="arr" marker-end="url(#arrow)"/>

  <rect x="60" y="290" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text class="th" x="150" y="309" fill="#085041" text-anchor="middle" dominant-baseline="central">MCP server</text>
  <text class="ts" x="150" y="327" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">/mcp · 5 car tools</text>

  <rect x="270" y="290" width="190" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/>
  <text class="th" x="365" y="309" fill="#712B13" text-anchor="middle" dominant-baseline="central">Charging planner</text>
  <text class="ts" x="365" y="327" fill="#993C1D" text-anchor="middle" dominant-baseline="central">A2A · /a2a/charging</text>

  <line x1="150" y1="346" x2="150" y2="396" class="arr" marker-end="url(#arrow)"/>
  <line x1="365" y1="346" x2="365" y2="396" class="arr" marker-end="url(#arrow)"/>

  <rect x="120" y="400" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text class="th" x="260" y="419" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Mock vehicle backend</text>
  <text class="ts" x="260" y="437" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Battery, climate, chargers</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
